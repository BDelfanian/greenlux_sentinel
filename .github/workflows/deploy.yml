name: Deploy

# App-level deploys only (Phase 5, docs/PROGRESS_LOG.md) -- builds+pushes the agent API image and
# redeploys the Container App, then builds+deploys the ETL Function App package. Deliberately
# does NOT touch infra/*.bicep: a full infra redeploy needs permissions well beyond what this
# workflow's identity has (Microsoft.Authorization/roleAssignments/write to (re)create the RBAC
# grants infra/modules/*.bicep declares, plus Key Vault read for postgresAdministratorPassword/
# apiAuthToken) -- a deliberate scope decision, not an oversight. Infra changes stay a manual
# `az deployment group create`, run by a human — see infra/README.md.
#
# Auth is OIDC via a user-assigned managed identity (id-greenlux-github-deploy, created directly
# as an Azure resource rather than an Entra app registration -- this tenant restricts app
# registration to admins, same restriction hit provisioning Power BI in Phase 4). No client
# secret exists anywhere; AZURE_CLIENT_ID/TENANT_ID/SUBSCRIPTION_ID below are plain repo
# variables, not secrets, since without a secret they don't grant access on their own.
#
# The `deploy` GitHub Environment requires manual approval before this job runs (repo Settings ->
# Environments -> deploy) -- a merge to main does not deploy unattended.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "function_app.py"
      - "requirements.txt"
      - "host.json"
      - "scripts/build_function_package.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - uses: actions/checkout@v5

      - name: Upgrade az CLI
        run: |
          # The runner's preinstalled az CLI is often several versions behind and has shown
          # different (buggier) deployment-status handling in `functionapp deployment source
          # config-zip` -- live-verified in Phase 5: this exact command consistently 409'd from
          # CI while the same command against the same app succeeded immediately from a machine
          # running az CLI 2.89.0. Pin to a known-good recent version rather than trust whatever
          # ubuntu-latest ships.
          az version
          az upgrade --yes --only-show-errors
          az version

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push agent API image
        run: |
          az acr login --name greenluxacrdevidckowude2cgc
          docker build -t greenluxacrdevidckowude2cgc.azurecr.io/greenlux-agents:${{ github.sha }} .
          docker push greenluxacrdevidckowude2cgc.azurecr.io/greenlux-agents:${{ github.sha }}

      - name: Update Container App
        run: |
          az containerapp update \
            --name ca-greenlux-agents-dev \
            --resource-group rg-greenlux-sentinel \
            --image greenluxacrdevidckowude2cgc.azurecr.io/greenlux-agents:${{ github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build Function App package
        run: python scripts/build_function_package.py

      - name: Deploy Function App package
        run: |
          # Actual root cause of the 409s (confirmed via --debug on a live CI run, not guessed):
          # config-zip's fast direct-to-storage upload path first GETs the Function App's App
          # Service Plan (Microsoft.Web/serverfarms/plan-greenlux-etl-dev) to detect Consumption
          # vs. Premium. This identity had RBAC on the Function App site itself but never on its
          # plan, so that GET 403'd (retried 5x by the CLI, ~40s, then silently gave up) and the
          # CLI fell back to the legacy Kudu /api/zipdeploy endpoint, which then 409'd on every
          # attempt. Fixed by granting Contributor on plan-greenlux-etl-dev directly -- see
          # infra/README.md. (Two earlier guesses -- az CLI version, Storage Blob Data Contributor
          # on the storage account -- were tried and ruled out first; neither was the real gap.)
          for attempt in 1 2 3; do
            if az functionapp deployment source config-zip \
                --name func-greenlux-etl-dev-idckowude2cgc \
                --resource-group rg-greenlux-sentinel \
                --src build/function-deploy.zip; then
              exit 0
            fi
            echo "config-zip attempt $attempt failed, retrying in 20s..." >&2
            sleep 20
          done
          echo "config-zip failed after 3 attempts" >&2
          exit 1

      - name: Verify agent API health
        run: |
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://ca-greenlux-agents-dev.politedesert-1edcbb25.francecentral.azurecontainerapps.io/healthz || true)
            [ "$status" = "200" ] && exit 0
            sleep 10
          done
          echo "Agent API did not report healthy after deploy" >&2
          exit 1
